[project]
name = "nemotron-deep-agent"
version = "0.1.0"
description = "General-purpose bog-agents agent: frontier orchestrator + Nemotron Super subagents + NVIDIA GPU skills"
requires-python = ">=3.11"
dependencies = [
    "bog-agents>=0.9.11",
    "langchain>=0.3.0",
    "langchain-anthropic>=1.5.3",
    "langgraph>=1.2.10",
    "tavily-python>=0.7.26",
    "httpx>=0.28.0",
    "markdownify>=1.2.3",
    "python-dotenv>=1.0.0",
    "langgraph-cli[inmem]>=0.1.55",
    "modal>=1.5.3",
    "langchain-modal>=0.0.5",
    "langchain-nvidia-ai-endpoints>=1.4.3",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
