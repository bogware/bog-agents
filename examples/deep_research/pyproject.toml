[project]
name = "deep-research-example"
version = "0.1.0"
description = "Deep research agent example using bog-agents package"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.4.1",
    "langchain-anthropic>=1.5.3",
    "langchain_tavily>=0.2.18",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=7.3.0",
    "tavily-python>=0.7.26",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "bog-agents>=0.9.11",
    "python-dotenv>=1.0.0",
    "langgraph-cli[inmem]>=0.1.55",
    "langchain-google-genai>=3.1.0",
]

[tool.uv]
override-dependencies = [
    "nbconvert>=7.17.0",  # CVE-2025-53000
    "protobuf>=6.33.5",  # CVE-2026-0994
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_agent"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
