[project]
name = "text2sql-bog-agents"
version = "0.1.0"
description = "A natural language to SQL query agent powered by LangChain's Bog Agents framework and Claude Sonnet 4.5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bog-agents>=0.9.10",
    "langchain>=1.2.3",
    "langchain-anthropic>=1.3.1",
    "langchain-community>=0.4.2",
    "langgraph>=1.0.6",
    "sqlalchemy>=2.0.51",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.7.26",
    "rich>=15.0.0",
]

[project.urls]
Repository = "https://github.com/bogware/bog-agents/tree/main/examples/text-to-sql-agent"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
