# Build, test, and publish a package to PyPI.
#
# Triggered by release-please.yml when a release PR is merged,
# or manually via workflow_dispatch for hotfixes.

name: Release

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: choice
        description: "Package to release"
        options:
          - bog-agents
          - bog-agents-cli
        default: bog-agents

env:
  PYTHON_VERSION: "3.11"
  UV_NO_SYNC: "true"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      working-dir: ${{ steps.parse.outputs.working-dir }}
    steps:
      - name: Parse package
        id: parse
        run: |
          PACKAGE="${{ inputs.package }}"
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          case "$PACKAGE" in
            bog-agents)     echo "working-dir=libs/bog-agents" >> $GITHUB_OUTPUT ;;
            bog-agents-cli) echo "working-dir=libs/cli" >> $GITHUB_OUTPUT ;;
            *) echo "Unknown package: $PACKAGE" && exit 1 ;;
          esac

  build:
    needs: setup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WORKING_DIR: ${{ needs.setup.outputs.working-dir }}
    outputs:
      pkg-name: ${{ steps.meta.outputs.pkg-name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        run: uv build
        working-directory: ${{ env.WORKING_DIR }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist/

      - name: Extract metadata
        id: meta
        shell: python
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          import os, tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"pkg-name={data['project']['name']}\n")
              f.write(f"version={data['project']['version']}\n")

  test:
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      WORKING_DIR: ${{ needs.setup.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist/

      # Verify the built package imports correctly
      - name: Test import
        working-directory: ${{ env.WORKING_DIR }}
        env:
          PKG_NAME: ${{ needs.build.outputs.pkg-name }}
        run: |
          uv venv
          VIRTUAL_ENV=.venv uv pip install dist/*.whl
          IMPORT_NAME="$(echo "$PKG_NAME" | sed s/-/_/g)"
          uv run python -c "import $IMPORT_NAME; print(dir($IMPORT_NAME))"

      # Run unit tests against the built package
      - run: uv sync --group test --locked
        working-directory: ${{ env.WORKING_DIR }}
      - name: Install built package over source
        working-directory: ${{ env.WORKING_DIR }}
        run: VIRTUAL_ENV=.venv uv pip install dist/*.whl
      - run: make test
        working-directory: ${{ env.WORKING_DIR }}

  publish:
    needs: [setup, build, test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
    env:
      WORKING_DIR: ${{ needs.setup.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.WORKING_DIR }}/dist/
          verbose: true
          print-hash: true
          attestations: false

  github-release:
    needs: [setup, build, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WORKING_DIR: ${{ needs.setup.outputs.working-dir }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.WORKING_DIR }}/dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.build.outputs.pkg-name }}==${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          draft: false
