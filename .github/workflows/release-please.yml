# Auto-creates release PRs from conventional commits.
# When a release PR is merged, triggers the release workflow.
#
# Requires: BOG_PAT secret (Personal Access Token with repo + pull_request scopes)

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  release-please:
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sdk-release: ${{ steps.check-sdk.outputs.is-release }}
      cli-release: ${{ steps.check-cli.outputs.is-release }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.BOG_PAT }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check SDK release
        id: check-sdk
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^libs/bog-agents/CHANGELOG.md$"; then
            echo "is-release=true" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Check CLI release
        id: check-cli
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^libs/cli/CHANGELOG.md$"; then
            echo "is-release=true" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

  # Update lockfiles when release-please creates a PR
  update-lockfiles:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: [self-hosted, Linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.BOG_PAT }}
      - uses: astral-sh/setup-uv@v7
      - name: Update lockfiles
        run: |
          for dir in libs/bog-agents libs/cli; do
            uv lock --directory "$dir" --python 3.12
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "*/uv.lock"
          if ! git diff --staged --quiet; then
            git commit -m "chore: update lockfiles"
            git push
          fi

  release-sdk:
    needs: release-please
    if: needs.release-please.outputs.sdk-release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      package: bog-agents
    secrets: inherit
    permissions:
      contents: write
      id-token: write

  release-cli:
    needs: release-please
    if: needs.release-please.outputs.cli-release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      package: bog-agents-cli
    secrets: inherit
    permissions:
      contents: write
      id-token: write
