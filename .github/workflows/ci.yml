# CI: Lint and test SDK + CLI on push to main and PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: "Lint"
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - { name: sdk, dir: libs/bog-agents }
          - { name: cli, dir: libs/cli }
    steps:
      - uses: actions/checkout@v6
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test --locked
        working-directory: ${{ matrix.package.dir }}
      - run: make lint
        working-directory: ${{ matrix.package.dir }}

