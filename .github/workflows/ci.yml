# CI: Lint and test SDK, CLI, and daemon on push to main and PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: "Lint"
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - { name: sdk, dir: libs/bog-agents }
          - { name: cli, dir: libs/cli }
          - { name: daemon, dir: libs/daemon }
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test --locked
        working-directory: ${{ matrix.package.dir }}
      - run: make lint
        working-directory: ${{ matrix.package.dir }}

  test:
    name: "Test (${{ matrix.package.name }}, py${{ matrix.python }}, ${{ matrix.os }})"
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows]
        # macos: no self-hosted macOS runner available
        # os: [Linux, Windows, macOS]
        package:
          - { name: sdk, dir: libs/bog-agents, test_args: "-n auto --disable-socket --allow-unix-socket tests/unit_tests/" }
          - { name: cli, dir: libs/cli, test_args: "-n auto --disable-socket --allow-unix-socket tests/unit_tests/" }
          - { name: daemon, dir: libs/daemon, test_args: "tests/ -q --timeout=30" }
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ matrix.python }}
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test --locked
        working-directory: ${{ matrix.package.dir }}
      - run: uv run --group test pytest ${{ matrix.package.test_args }}
        working-directory: ${{ matrix.package.dir }}
