# CI: Lint and test SDK + CLI on every PR and push to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - { name: sdk, dir: libs/bog-agents }
          - { name: cli, dir: libs/cli }
    steps:
      - uses: actions/checkout@v6
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test --locked
        working-directory: ${{ matrix.package.dir }}
      - run: make lint
        working-directory: ${{ matrix.package.dir }}

  test:
    name: "Test (${{ matrix.package.name }}, py${{ matrix.python }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: sdk, dir: libs/bog-agents }
          - { name: cli, dir: libs/cli }
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ matrix.python }}
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test --locked
        working-directory: ${{ matrix.package.dir }}
      - run: make test
        working-directory: ${{ matrix.package.dir }}
        env:
          RUN_SANDBOX_TESTS: "true"
