# CI: Lint and test SDK, CLI, daemon, and satellites (acp/harbor/daytona), plus
# a lockfile-drift guard, on push to main and PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: "Lint"
    runs-on: [self-hosted, Linux]
    # Skip fork PRs — untrusted code must not run on self-hosted runners.
    # In-repo branch PRs and pushes to main are trusted and run normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - { name: sdk, dir: libs/bog-agents }
          - { name: cli, dir: libs/cli }
          - { name: daemon, dir: libs/daemon }
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.11"
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test
        working-directory: ${{ matrix.package.dir }}
      - run: make lint
        working-directory: ${{ matrix.package.dir }}

  test:
    name: "Test (${{ matrix.package.name }}, py${{ matrix.python }}, ${{ matrix.os }})"
    runs-on: [self-hosted, "${{ matrix.os }}"]
    # Skip fork PRs — untrusted code must not run on self-hosted runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows]
        # macos: no self-hosted macOS runner available
        # os: [Linux, Windows, macOS]
        package:
          - { name: sdk,    dir: libs/bog-agents }
          - { name: cli,    dir: libs/cli }
          - { name: daemon, dir: libs/daemon }
        python: ["3.12", "3.13"]  # 3.11 temporarily disabled
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: ${{ matrix.python }}
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test
        working-directory: ${{ matrix.package.dir }}
      # sdk/cli on Linux: enforce socket isolation
      - name: Run tests
        if: matrix.package.name != 'daemon' && runner.os == 'Linux'
        run: uv run --group test pytest -n auto --disable-socket --allow-unix-socket tests/unit_tests/
        working-directory: ${{ matrix.package.dir }}
      # sdk/cli on Windows: no parallel, no socket plugin (pytest-socket incompatible with Windows ProactorEventLoop)
      - name: Run tests
        if: matrix.package.name != 'daemon' && runner.os == 'Windows'
        run: uv run --group test pytest -p no:socket tests/unit_tests/
        working-directory: ${{ matrix.package.dir }}
      # daemon: same command on all OSes (no socket plugin needed)
      - name: Run tests
        if: matrix.package.name == 'daemon'
        run: uv run --group test pytest tests/ -q --timeout=30
        working-directory: ${{ matrix.package.dir }}

  # DEL-5/v4: guard against lockfile drift (harbor + daytona locks were stale and
  # nothing caught it — the test jobs `uv sync` without --frozen, so they silently
  # re-resolve). `make lock-check` runs `uv lock --check` for every package dir.
  lock-check:
    name: "Lock check"
    runs-on: [self-hosted, Linux]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.12"
          working-directory: libs/bog-agents
          # A lock check must resolve against the live index, not a warm cache
          # restored from another job — a stale/cross-uv-version cache makes the
          # deterministic re-resolution differ from the committed lockfile.
          enable-cache: "false"
      # v5 SAT-1: this gate was temporarily demoted to advisory
      # (continue-on-error) over a suspected runner-local uv quirk — and the
      # Aug 2 release then regenerated real satellite lockfile drift that the
      # advisory gate silently masked. The drift is fixed (acp/harbor/daytona
      # re-locked) and the check is BLOCKING again. The diagnostic step below
      # stays so a genuine runner-environment failure (global uv.toml,
      # UV_UPGRADE/UV_RESOLUTION, private index mirror) is distinguishable
      # from real drift — do not re-demote this gate; fix the drift instead.
      - name: Diagnose uv resolution environment
        run: |
          echo "::group::uv version"; uv --version; echo "::endgroup::"
          echo "::group::UV_* environment"; env | grep -i '^UV' || echo "(none)"; echo "::endgroup::"
          echo "::group::uv config files"
          for f in "$HOME/.config/uv/uv.toml" /etc/uv/uv.toml ./uv.toml; do
            [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; } || echo "(absent) $f"
          done
          echo "::endgroup::"
      - name: Lock check
        run: make lock-check

  # SAT-3/DEL-6/v4: the satellite packages ship Makefiles, tests, and lockfiles
  # but had no PR CI — which is how SAT-1 (harbor's tests green while its backend
  # was broken) and SAT-2 (acp red at HEAD) shipped unnoticed. Linux-only leg,
  # py3.12 (harbor requires >=3.12).
  # deepagents drop-in parity is a maintained guarantee (PARITY.md), but the SDK
  # venv does not install deepagents, so a breaking upstream release could not be
  # caught here — 0.7.0 went GA and reached 0.7.13 unscouted (REVIEW v6 SDK-12).
  # This leg resolves the *latest* deepagents into an overlay next to the SDK,
  # proves the two co-install, and runs the compat + upstream-parity tests.
  deepagents-parity:
    name: "deepagents parity (latest)"
    runs-on: [self-hosted, Linux]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.12"
          working-directory: libs/bog-agents
      - run: uv sync --group test
        working-directory: libs/bog-agents
      - name: Co-install the latest deepagents and smoke-import both
        run: |
          uv run --with deepagents --group test python -c "import deepagents, bog_agents.deepagents, importlib.metadata as m; print('deepagents', m.version('deepagents'))"
        working-directory: libs/bog-agents
      - name: Compat + upstream-parity tests against the latest deepagents
        run: uv run --with deepagents --group test pytest -q tests/unit_tests/test_deepagents_compat.py tests/unit_tests/test_graph_upstream_parity.py
        working-directory: libs/bog-agents

  satellites:
    name: "Satellites (${{ matrix.package.name }})"
    runs-on: [self-hosted, Linux]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          - { name: acp, dir: libs/acp }
          - { name: harbor, dir: libs/harbor }
          - { name: daytona, dir: libs/partners/daytona }
    steps:
      - uses: actions/checkout@v4
      - uses: "./.github/actions/uv_setup"
        with:
          python-version: "3.12"
          working-directory: ${{ matrix.package.dir }}
      - run: uv sync --group test
        working-directory: ${{ matrix.package.dir }}
      # `make test` (not the whole tests dir) so daytona's `TEST_FILE` default
      # skips its integration suite. Lint is intentionally omitted for now —
      # these packages carry pre-existing lint debt; the drift guard that matters
      # is that their unit tests actually run.
      - run: make test
        working-directory: ${{ matrix.package.dir }}
