# Dependabot configuration (V3-9).
#
# Keeps the hand-maintained transitive-CVE floors (cryptography, urllib3,
# requests, pyasn1, pygments, aiohttp, pillow, langsmith, python-multipart,
# pyjwt, ...) self-sustaining across all Python packages + GitHub Actions,
# instead of requiring a manual re-audit each cycle. Uses the native `uv`
# ecosystem so uv.lock files are updated alongside pyproject.toml.
#
# Minor/patch bumps are grouped per package to keep PR noise low; majors come
# as individual PRs so breaking changes are reviewed in isolation.
version: 2

updates:
  # ---- Python packages (uv) ----
  - package-ecosystem: "uv"
    directory: "/libs/bog-agents"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/libs/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/libs/daemon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/libs/acp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/libs/harbor"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "uv"
    directory: "/libs/partners/daytona"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # ---- npm (VS Code extension) ----
  - package-ecosystem: "npm"
    directory: "/libs/vscode-extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # ---- GitHub Actions ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
