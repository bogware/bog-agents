# Dependabot configuration.
#
# Posture: MANUAL-ONLY. Automatic scheduled version-update PRs are disabled
# (`open-pull-requests-limit: 0` on every ecosystem) so Dependabot never opens
# a version-bump PR on its own and never spends CI minutes unprompted. The
# ecosystem/grouping config is kept so updates can still be run ON DEMAND.
#
# To run a dependency update manually:
#   1. Temporarily set `open-pull-requests-limit` back to 1 for the ecosystem
#      you want, on a branch; Dependabot picks it up on the next scan (or use
#      the repo's Insights -> Dependency graph -> Dependabot -> "Check for
#      updates" button to force a run), opens the one grouped PR, then set the
#      limit back to 0.
#   OR do the bump by hand with `uv lock --upgrade` (or `npm update`) in the
#      package dir and commit it — usually simpler for a one-off.
#
# The `schedule.interval` keys are retained because Dependabot's schema requires
# them, but with the limit at 0 the schedule opens nothing.
#
# Dependabot ALERTS stay ON (you still get notified of advisories), and
# Dependabot security auto-fix PRs are already disabled at the repo-settings
# level — so nothing here re-enables automatic PRs of any kind.
#
# NOTE: Dependabot's parser does not support YAML anchors/merge keys, so each
# block is written out in full.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/libs/bog-agents"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      all-dependencies:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

