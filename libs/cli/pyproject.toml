[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bog-agents-cli"
version = "0.9.9"
description = "Bog Agents CLI — your coding agent in the terminal, patient as still water. 80+ slash commands, any LLM provider (Anthropic, OpenAI, Bedrock, Google, Ollama and more), persistent memory, plan mode, /qa acceptance-criteria harness, /peat personal scheduler, /record + /replay, in-memory secrets vault, MCP marketplace with 35+ servers, deep doctor, panic dumps, and a matte swamp/neon-green TUI. One install, no code required. Pass through in harmony."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bogware", email = "support@bogware.com" }]
maintainers = [{ name = "bogware", email = "support@bogware.com" }]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "cli", "terminal", "llm", "langgraph", "langchain", "bog-agents", "multi-provider", "ollama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    # Framework — accept any 0.x release of the SDK. The CLI tracks the
    # SDK closely; tighten back to a major-minor pin if a future SDK
    # release breaks compat.
    "bog-agents>=0.7.0,<1.0.0",
    "langchain>=1.2.10,<2.0.0",
    "langgraph>=1.1.2,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",

    # Client-server architecture
    "langgraph-sdk>=0.3.11,<1.0.0",
    "langgraph-cli[inmem]>=0.4.15,<1.0.0",
    "httpx>=0.28.1,<1.0.0",

    # Require at least one integration package
    # GHSA-r7w7-9xr2-qq2r — fix landed in 1.1.14
    "langchain-openai>=1.1.14,<2.0.0",

    # Observability
    # GHSA-rr7j-v2q5-chgv — fix landed in 0.7.31
    # CVE-2026-45134 — fix landed in 0.8.0
    "langsmith>=0.8.0,<1.0.0",

    # UI/Terminal
    "textual>=8.0.0,<9.0.0",
    "textual-autocomplete>=3.0.0,<5.0.0",
    "prompt-toolkit>=3.0.52,<4.0.0",
    "rich>=14.0.0,<15.0.0",
    "markdownify>=0.13.0,<2.0.0",

    # Clipboard
    "pyperclip>=1.11.0,<2.0.0",

    # Utilities
    "uuid-utils>=0.10.0,<1.0.0",
    # CVE-2026-28684 — fix landed in 1.2.2
    "python-dotenv>=1.2.2,<2.0.0",
    # CVE-2026-25645 — fix landed in 2.33.0
    "requests>=2.33.0,<3.0.0",
    # CVE-2026-40192 — fix landed in 12.2.0
    "pillow>=12.2.0,<13.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "croniter>=3.0.0,<4.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "tomli-w>=1.0.0,<2.0.0",

    # MCP
    "langchain-mcp-adapters>=0.2.0,<1.0.0",

    # Secret store (optional OS keyring backend; falls back to 0600 TOML)
    "keyring>=25.0.0,<27.0.0",

    # ─── transitive-CVE floors (kept here so users picking up
    # bog-agents-cli automatically pull a patched resolver result) ─────
    # CVE-2026-32597 — pyjwt auth-validation fix
    "pyjwt>=2.12.0",
    # CVE-2026-34073 + CVE-2026-39892 — cryptography TLS fixes
    "cryptography>=46.0.7",
    # CVE-2026-40347 — python-multipart DoS fix via starlette/uvicorn chain
    "python-multipart>=0.0.26",
    # CVE-2026-4539 — pygments ReDoS fix (used by rich)
    "pygments>=2.20.0",
    # CVE-2026-30922 — pyasn1 DoS fix
    "pyasn1>=0.6.3",
    # CVE-2026-44431 + CVE-2026-44432 — urllib3 SSRF/cookie fixes
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
# Model providers
anthropic = ["langchain-anthropic>=1.0.0,<2.0.0"]
baseten = ["langchain-baseten>=0.1.9,<1.0.0"]
bedrock = ["langchain-aws>=1.0.0,<2.0.0"]
cohere = ["langchain-cohere>=0.5.0,<1.0.0"]
deepseek = ["langchain-deepseek>=1.0.0,<2.0.0"]
fireworks = ["langchain-fireworks>=1.0.0,<2.0.0"]
google-genai = ["langchain-google-genai>=4.0.0,<5.0.0"]
groq = ["langchain-groq>=1.0.0,<2.0.0"]
huggingface = ["langchain-huggingface>=1.0.0,<2.0.0"]
ibm = ["langchain-ibm>=1.0.0,<2.0.0"]
litellm = ["langchain-litellm>=0.6.1,<2.0.0"]
mistralai = ["langchain-mistralai>=1.0.0,<2.0.0"]
nvidia = ["langchain-nvidia-ai-endpoints>=1.0.0,<2.0.0"]
ollama = ["langchain-ollama>=1.0.0,<2.0.0"]
openai = ["langchain-openai>=1.1.8,<2.0.0"]
openrouter = ["langchain-openrouter>=0.1.0,<2.0.0"]
perplexity = ["langchain-perplexity>=1.0.0,<2.0.0"]
vertexai = ["langchain-google-vertexai>=3.0.0,<4.0.0"]
xai = ["langchain-xai>=1.0.0,<2.0.0"]
all-providers = [
    "bog-agents-cli[anthropic,baseten,bedrock,cohere,deepseek,fireworks,google-genai,groq,huggingface,ibm,litellm,mistralai,nvidia,ollama,openai,openrouter,perplexity,vertexai,xai]",
]
# Sandbox integrations (heavy dependencies, install only if needed)
sandbox = [
    "langsmith[sandbox]>=0.7.7",
    "daytona>=0.113.0,<1.0.0",
    "modal>=0.65.0,<2.0.0",
    "runloop-api-client>=0.69.0",
]
daytona-sandbox = ["daytona>=0.113.0,<1.0.0"]
modal-sandbox = ["modal>=0.65.0,<2.0.0"]
runloop-sandbox = ["runloop-api-client>=0.69.0"]
langsmith-sandbox = ["langsmith[sandbox]>=0.7.7"]
# Web search
web-search = ["tavily-python>=0.7.21,<1.0.0"]
# Agent Client Protocol
acp = ["bog-agents-acp>=0.0.4"]
# Everything
all = [
    "bog-agents-cli[all-providers,sandbox,web-search,acp]",
]

# Console-script entry points.
#
# ``bog-agents`` is canonical. ``bog-agents-cli`` is retained as an
# alias because early adopters scripted against the longer name; it
# is identical and is documented in the README as "the same thing".
# When we cut a major version we will deprecate the alias and emit a
# one-time warning before falling through to ``cli_main``. Until then
# both stay wired up so existing CI/launcher scripts keep working.
[project.scripts]
bog-agents = "bog_agents_cli:cli_main"
bog-agents-cli = "bog_agents_cli:cli_main"

[project.urls]
Homepage = "https://github.com/bogware/bog-agents"
Repository = "https://github.com/bogware/bog-agents"
Issues = "https://github.com/bogware/bog-agents/issues"
Changelog = "https://github.com/bogware/bog-agents/blob/main/libs/cli/CHANGELOG.md"

[dependency-groups]
test = [
    "build>=1.0.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
    "ty>=0.0.1,<1.0.0",
    "pytest>=9.0.3,<10.0.0",  # CVE-2025-71176 — fix landed in 9.0.3
    "pytest-asyncio>=0.25.3,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-watcher>=0.3.4,<1.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "responses>=0.25.0,<1.0.0",
    "twine>=6.0.0,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bog_agents_cli"]
include = [
    "bog_agents_cli/defaults/**/*",
    "bog_agents_cli/bundled_agents/**/*",
]

[tool.hatch.build.targets.wheel.shared-data]
"bog_agents_cli/default_agent_prompt.md" = "bog_agents_cli/default_agent_prompt.md"
"bog_agents_cli/*.tcss" = "bog_agents_cli/"

[tool.uv.sources]
bog_agents = { path = "../bog-agents", editable = true }
bog-agents-acp = { path = "../acp", editable = true }

[tool.ty.src]
exclude = [".pytest-tmp-runtime"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["../bog-agents"]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
division-by-zero = "error"
# Optional dependencies (daytona, modal, runloop, tavily, acp) are not installed
# in the base venv — they're extras. Suppress unresolved import errors.
unresolved-import = "ignore"
# CLI uses dynamic typing patterns extensively (Any from argparse, config, etc.)
invalid-argument-type = "ignore"
possibly-missing-attribute = "ignore"
# Many stale type: ignore comments from pre-ty migration; clean up incrementally
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"
# asyncio.to_thread ParamSpec inference limitation and test global state patterns
too-many-positional-arguments = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
# LangChain's AgentMiddleware abstract-method signatures tightened in 1.2.x.
# Our middleware override them with slightly different but runtime-compatible
# shapes (extra kwargs, narrower return types). ty's Liskov-strict check is
# too sharp here — the runtime contract is preserved.
invalid-method-override = "ignore"
# Several middleware narrow ``StateT`` to a project-specific TypedDict that
# doesn't extend ``AgentState[Any]`` literally even though it's structurally
# compatible. Same runtime-vs-typespec story as invalid-method-override.
invalid-type-arguments = "ignore"
# Middleware whose ``wrap_model_call`` returns a more-specific subtype than
# the abstract method declares — fine at runtime, ty flags it.
invalid-return-type = "ignore"
# Profile / mode / interrupt-on dict assignments where ty inferred a wider
# type than the assigned literal. The assignments are correct at runtime;
# tightening every site to satisfy ty would be substantial busywork and
# would lose conciseness for no real safety gain.
invalid-assignment = "ignore"
# A few sites use ``request.__replace__`` (Python 3.13 dataclass dunder)
# which ty types as ``object``. The runtime call is correct.
call-non-callable = "ignore"
# docker.py ExecuteResponse uses sandbox_id; langsmith client is dynamically typed
unknown-argument = "ignore"
no-matching-overload = "ignore"
# langsmith client returned as object; winsound is Windows-only optional module
unresolved-attribute = "ignore"

[tool.ruff]
exclude = [".pytest-tmp-runtime"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "ANN202",  # Missing return type annotation for private function — internal helpers
    "BLE001",  # Blind exception catch — CLI resilience
    "C90",     # McCabe complexity
    "COM812",  # Messes with the formatter
    "CPY",     # No copyright
    "D107",    # Missing docstring in __init__
    "DOC201",  # Docstring missing returns — not always applicable
    "E501",    # Line too long — handled by formatter where possible
    "EXE001",  # Shebang not executable — scripts may not need execute bit
    "FBT",     # Boolean positional arguments (too pedantic)
    "FIX002",  # Line contains TODO
    "FLY002",  # Consider f-string instead of join — join is clearer for multi-line strings
    "FURB113", # Repeated append — readability over micro-optimization
    "FURB118", # Reimplemented operator — lambda is clearer in context
    "ISC001",  # Messes with the formatter
    "ISC004",  # Implicit string concatenation in collection literal
    "PERF203", # Rarely useful
    "PERF401", # Manual list comprehension — readability
    "PLC0414", # Inconsistent with how type checkers expect to be notified of intentional re-exports
    "PLC0415", # Lazy imports are used extensively throughout the CLI for startup performance (deferred heavy imports)
    "PLR09",   # Too many something (args, branches, returns, statements, etc)
    "PLR1702", # Too many nested blocks
    "PLR2004", # Magic value comparison — fine for CLI logic
    "PLR6104", # Non-augmented assignment — readability
    "PLR6201", # Literal membership — readability
    "S105",    # Hardcoded password string — false positives in CLI config
    "S310",    # Suspicious URL open — CLI opens user-provided URLs by design
    "S607",    # Start process with partial path — CLI invokes system tools by design
    "SIM103",  # Needless bool — readability
    "SIM105",  # Suppressible exception — try/except/pass is clearer sometimes
    "SLF001",  # Private member access
    "TC003",   # Typing-only standard library import — keep explicit
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "TRY003",  # Long-message exceptions — convention across the CLI is to
               # carry user-facing detail in the exception text itself; the
               # alternative (a dedicated class per error class) is overkill
               # for slash-command handlers.
    "EM101",   # Raw string in exception — same rationale as TRY003.
    "EM102",   # f-string in exception — same rationale.
    "TRY300",  # Consider moving to else block — readability
    "UP036",   # Outdated version block — backwards compat
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["bog_agents_cli"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",   # Missing type annotation for function argument — not needed in tests
    "ANN002",   # Missing type annotation for *args — not needed in tests
    "ANN003",   # Missing type annotation for **kwargs — not needed in tests
    "ANN201",   # Missing return type annotation — not needed in tests
    "ANN202",   # Missing return type annotation — not needed in tests
    "ARG001",   # Unused arg — common in stub callbacks for ask/prompt tests
    "ARG002",   # Unused method argument — fixture params (e.g. tmp_path) may be unused in some tests
    "ARG005",   # Unused lambda argument — stub callbacks intentionally drop args
    "B903",     # "class could be dataclass" — concise fixture helpers don't need dataclass machinery
    "D205",     # 1-blank-line-between-summary-and-description — test docstrings are often one-liners
    "PT012",    # pytest.raises with multiple statements — fine in test scaffolding
    "PT018",    # "break down compound assertion" — composite asserts read better than several lines in tests
    "PT019",    # fixture-without-value injected as parameter — old-style fixture wiring is fine in tests
    "RUF029",   # Async function w/o await — required to satisfy async callback signatures
    "RUF069",   # Float equality — exact == is fine when comparing to known constants in tests
    "TRY301",   # `raise` inside try — fine in tests that exercise excepthook flows
    "F841",     # Local variable assigned but unused — common in test setup
    "PT011",    # pytest.raises match= not required in tests — intent is clear from test name
    "SIM117",   # Nested with statements — readability in complex test setups
    "D1",       # Missing docstrings — not needed in tests
    "DOC",      # Docstring conventions — not needed in tests
    "F401",     # Imported but unused — test fixtures may appear unused
    "PLC0415",  # Lazy imports — test organization patterns
    "PLC1901",  # Comparison to empty string — fine in test assertions
    "PLC2701",  # Private name import — tests need access to internals
    "PLR2004",  # Magic value used in comparison — fine in test assertions
    "PLR6201",  # Literal membership test — fine in tests
    "PLR6301",  # Method could be a function — test class organization
    "PLW0108",  # Lambda may be unnecessary — fine in test mocks
    "RUF001",   # Ambiguous characters — fine in test strings
    "S",        # Security warnings — not applicable to tests
    "SLF",      # Private member access — tests need access to internals
]
"scripts/**" = [
    "BLE001",   # Blind exception catch — resilience in standalone scripts
    "INP",      # Missing `__init__.py` — scripts are standalone
    "S",        # Security warnings — not applicable to scripts
    "T201",     # `print` found — scripts use print for output
]
# QA harness, vault, vars, replay: dynamic data wrangling with intentional
# Any-typed inputs (YAML/JSON), shell execution, and helper dataclasses
# whose to/from-dict pairs don't need separate docstrings.
"bog_agents_cli/qa/**" = [
    "ANN401",   # Any in YAML/JSON loaders — by design
    "ASYNC210", # urllib in HTTP step — explicit choice to avoid extra deps
    "D102",     # Missing docstring on dataclass to/from_dict helpers
    "D105",     # Missing docstring on dunder methods
    "DOC501",   # Raises missing from docstring — covered in module docstring
    "DOC502",   # Documented raise from caller, not body
    "PLR0915",  # Too many statements — handler scaffolding
    "S404",     # subprocess imported — required for shell step
    "TRY004",   # ValueError vs TypeError — kept for caller compatibility
]
# Drive package: scripted-TUI runner that parses YAML actions (Any-typed
# inputs by nature), wraps Pilot primitives, and orchestrates a real app
# under run_test(). The handlers translate YAML payloads to dataclasses
# so they take `Any` at the boundary; the snapshot capture path
# intentionally swallows widget render failures so a transient one
# doesn't abort the whole script.
"bog_agents_cli/drive/**" = [
    "ANN401",   # Any at the YAML-parsing boundary — by design
    "D102",     # Missing docstring on small dataclass helpers
    "D105",     # Missing docstring on dunder methods
    "D205",     # Multi-paragraph summaries — readable here
    "DOC501",   # Raises documented at module level, not per-helper
    "PLR0911",  # Many returns — _dispatch_action is a type dispatch
    "PLR0912",  # Many branches — same
    "RUF029",   # Sync handler typed async to match the dispatch table
    "S110",     # try/except/pass — snapshot rendering is best-effort
    "S112",     # try/except/continue — same
    "TRY004",   # ValueError chosen for parser errors over TypeError
    "TRY301",   # Abstract raise — kept inline in the snapshot fallback
]
# Dreamscape package: dataclass-heavy, dynamic-data-heavy, intentionally
# uses Any for cross-cutting helpers (response normalisation, config
# overlays) and re-uses the SDK's middleware ``_utils`` private helper.
"bog_agents_cli/dreamscape/**" = [
    "ANN401",   # Any in response normalisation + config helpers — by design
    "D102",     # Missing docstring on dataclass to_dict / property helpers
    "D103",     # Missing docstring on small helper functions
    "D105",     # Missing docstring on dunder methods
    "D205",     # Multi-paragraph one-line summaries — readable here
    "DOC501",   # Raises documented at module / class level, not per-method
    "DOC502",   # Documented raise propagates from a callee, not raised in body
    "PLC1901",  # `== ""` checks are fine in dream-frontmatter parsing
    "PLC2701",  # ``_utils`` import is the canonical SDK middleware helper
    "PLR6301",  # Method-could-be-static on backend protocol implementations
    "RUF001",   # Em-dash + multiplication-sign used in dashboard glyphs
    "S110",     # try/except/pass — observability paths must be silent on failure
    "S311",     # random for non-cryptographic sampling (dream seeds)
]
# Slash-command controllers (moat waves Q/R/S/T): dispatch tables,
# user-facing error rendering, ingest of foreign-vendor payloads.
# The user-facing-string rules (TRY003/EM101/EM102) and defensive
# bare-Exception trapping (BLE001) are CLI-wide convention and live
# in the global ignore list; per-file entries cover the remaining
# module-specific surface.
"bog_agents_cli/{causal,policy_prove,compliance,tracefile,expert}/**" = [
    "ANN401",   # Any in YAML loader / payload preview signatures
    "DOC501",   # Exceptions documented at module level
    "DOC502",   # Cron raises documented at module level
    "D102",     # Property accessors / thin delegators
    "D105",     # __len__ / __repr__ etc are self-describing
    "D205",     # Multi-paragraph one-line summaries in renderers
    "PLR0911",  # Dispatch tables read better as flat ifs
    "RET504",   # Local-then-return improves readability of session list
    "RUF001",   # Unicode arrows (→/✓/✗) in renderers
    "S110",     # try/except/pass in defensive paths
    "TC001",    # Cross-module dataclasses kept eager for clarity
]
"bog_agents_cli/expert_controller.py" = [
    "D102",     # Delegator methods — docstring lives on the free function
]
# Postmortem / time-travel / web fetch / computer use / feedback loop:
# small standalone slash modules. Share the same dispatch + user-facing
# error shape as the moat subpackages.
"bog_agents_cli/{postmortem,time_travel,web_fetch,computer_use,feedback_loop}.py" = [
    "ANN401",
    "A002",     # ``input`` kwarg in time_travel API
    "ARG001",   # placeholder args for future symmetry
    "DOC501",
    "D102",     # property accessors
    "PLR0911",
    "S110",     # decode-fallback paths
    "SLF001",   # stash sentinel attributes on third-party objects
]
# TraceFile + Claude Code exporter: ingest arbitrary vendor payloads.
"bog_agents_cli/tracefile/**" = [
    "PLR0912",
    "PLR0915",
    "PLC0415",
    "TC003",
    "ARG004",
    "ARG005",
    "PT004",
    "S104",
    "D101",     # LineKind enum is self-describing
    "D301",     # Hook-payload docstring shows raw backslash escapes by design
    "C901",     # Adapters have many branches mapping vendor payloads
    "B007",     # idx loop var kept for future trace-line context
]
# Compliance has a few extras: lazy renderer imports + the
# CronAuditFailed naming convention.
"bog_agents_cli/compliance/**" = [
    "PLR0912",
    "PLR0915",
    "PLC0415",  # Lazy slash-output imports — intentional in renderers
    "N818",     # CronAuditFailed reads like the daemon's exit semantics
]
"bog_agents_cli/vars.py" = [
    "ANN401",   # Any in user-supplied values — by design
    "D102",     # Missing docstring on dataclass to/from_dict helpers
    "D105",     # Missing docstring on __post_init__ / dunder methods
    "DOC501",   # VarError documented at module level
    "DOC502",   # VarError raised in a helper, not the public method body
    "TRY004",   # ValueError used uniformly for var bundle errors
]
"bog_agents_cli/vault.py" = [
    "ANN401",   # Any in render() — recursively walks user data
    "D105",     # Missing docstring on __repr__/__eq__/__hash__/__bool__
    "PLW0603",  # Module-level singleton intentionally uses `global`
]
"bog_agents_cli/replay.py" = [
    "ANN401",   # Any in YAML/JSON loaders — by design
    "D102",     # Missing docstring on dataclass to/from_dict helpers
    "D105",     # Missing docstring on dunder methods
    "DOC501",   # ValueError documented at module level
    "TRY004",   # ValueError used for shape/parse mismatches
]
# Refinement modules added in 0.8.x — small dataclass holders, structured
# logging emitter, panic dump, deep doctor. None of these need the full
# docstring/typing rigor we apply elsewhere.
"bog_agents_cli/_observability.py" = [
    "ANN401",   # Any in **fields — by design (caller-supplied structured fields)
    "BLE001",   # Bare ``except Exception`` — required because timer is a stdlib pattern
    "PLR2004",  # Magic value used in slicing (the 80-char repr cap)
    "TRY401",   # Redundant exception object included in logger.exception
]
"bog_agents_cli/_panic.py" = [
    "ANN401",   # Any in extra fields — caller-supplied
    "BLE001",   # Bare ``except Exception`` — required: panic handler must never raise
    "PERF203",  # try/except inside loop — necessary for fault isolation
    "S110",     # Silent exception — explicitly justified (panic handler resilience)
    "TRY300",   # else block — readability preference
]
"bog_agents_cli/doctor_deep.py" = [
    "BLE001",   # Bare ``except Exception`` — probes intentionally cannot raise
    "D101",     # Missing docstring on Probe dataclass — fields are self-explanatory
    "PERF203",  # try/except in probe loop — fault-isolation pattern
    "S404",     # subprocess imported — probes use it for git --version
    "TRY300",   # else block — readability preference
    "TRY401",   # logger.exception in probe — intentional
]
# Peat: prompt-builder package + schedulers + dataclass IO. Same shape as
# the QA harness — short helper methods don't need duplicate docstrings.
"bog_agents_cli/peat/**" = [
    "ANN401",   # Any in YAML/JSON loaders — by design
    "D102",     # Missing docstring on dataclass to/from_dict helpers
    "D103",     # Missing docstring on small helpers (jobs_dir, etc.)
    "D105",     # Missing docstring on dunder methods
    "DOC501",   # ValueError documented at module level
    "TRY004",   # ValueError used for shape/parse mismatches
    "PLR0915",  # Too many statements in handler scaffolding
]
"examples/**" = [
    "ANN001",   # Missing type annotation for function argument — examples prioritize clarity
    "ANN201",   # Missing return type annotation — examples prioritize clarity
    "BLE001",   # Blind exception catch — resilience in example scripts
    "INP001",   # Missing `__init__.py` — examples are standalone
    "N806",     # Variable in function should be lowercase — example naming conventions
    "PLC0415",  # Lazy import — example organization patterns
    "PLR2004",  # Magic value used in comparison — fine in examples
    "T201",     # `print` found — examples use print for output
    "TRY300",   # Consider moving to `else` block — examples prioritize readability
]
"bog_agents_cli/built_in_skills/**/scripts/**" = [
    "ANN001",   # Missing type annotation for function argument — standalone scripts
    "ANN201",   # Missing return type annotation — standalone scripts
    "BLE001",   # Blind exception catch — resilience in standalone scripts
    "INP001",   # Missing `__init__.py` — scripts are standalone
    "N806",     # Variable in function should be lowercase — script naming conventions
    "PLR2004",  # Magic value used in comparison — fine in scripts
    "T201",     # `print` found — scripts use print for output
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
timeout = 30  # Default timeout for all tests (can be overridden per-test)

addopts = "--strict-markers --strict-config --durations=5 -p no:cacheprovider"
# pytest-benchmark warns once per xdist worker that benchmarks are disabled
# under parallel execution. Both plugins are needed: xdist for `make test`,
# benchmark for `make benchmark`. Suppress the noise here.
# Use a message-match filter so the import of pytest_benchmark isn't required
# when the plugin is not installed.
filterwarnings = [
    "ignore:.*pytest.benchmark.*:pytest.PytestConfigWarning",
    "ignore:.*virtual_mode.*:DeprecationWarning",
    "ignore:.*StoreBackend without explicit.*:DeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
