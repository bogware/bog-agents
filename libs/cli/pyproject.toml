[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bog-agents-cli"
version = "0.7.1"
description = "A coding agent in your terminal. 50+ commands, any LLM provider, persistent memory, git workflow, code review, plan mode, remote sandboxes, and CI/CD automation. One install, no code required."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bogware", email = "support@bogware.com" }]
maintainers = [{ name = "bogware", email = "support@bogware.com" }]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "cli", "terminal", "llm", "langgraph", "langchain", "bog-agents", "multi-provider", "ollama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
]
dependencies = [
    # Framework
    "bog-agents>=0.7.0,<1.0.0",
    "langchain>=1.2.10,<2.0.0",
    "langgraph>=1.1.2,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",

    # Client-server architecture
    "langgraph-sdk>=0.3.11,<1.0.0",
    "langgraph-cli[inmem]>=0.4.15,<1.0.0",
    "httpx>=0.28.1,<1.0.0",

    # Require at least one integration package
    "langchain-openai>=1.1.8,<2.0.0",

    # Observability
    "langsmith>=0.7.7,<1.0.0",

    # UI/Terminal
    "textual>=8.0.0,<9.0.0",
    "textual-autocomplete>=3.0.0,<5.0.0",
    "prompt-toolkit>=3.0.52,<4.0.0",
    "rich>=14.0.0,<15.0.0",
    "markdownify>=0.13.0,<2.0.0",

    # Clipboard
    "pyperclip>=1.11.0,<2.0.0",

    # Utilities
    "uuid-utils>=0.10.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.0.0,<3.0.0",
    "pillow>=10.0.0,<13.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "croniter>=3.0.0,<4.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "tomli-w>=1.0.0,<2.0.0",

    # MCP
    "langchain-mcp-adapters>=0.2.0,<1.0.0",

    # Secret store (optional OS keyring backend; falls back to 0600 TOML)
    "keyring>=25.0.0,<27.0.0",
]

[project.optional-dependencies]
# Model providers
anthropic = ["langchain-anthropic>=1.0.0,<2.0.0"]
baseten = ["langchain-baseten>=0.1.9,<1.0.0"]
bedrock = ["langchain-aws>=1.0.0,<2.0.0"]
cohere = ["langchain-cohere>=0.5.0,<1.0.0"]
deepseek = ["langchain-deepseek>=1.0.0,<2.0.0"]
fireworks = ["langchain-fireworks>=1.0.0,<2.0.0"]
google-genai = ["langchain-google-genai>=4.0.0,<5.0.0"]
groq = ["langchain-groq>=1.0.0,<2.0.0"]
huggingface = ["langchain-huggingface>=1.0.0,<2.0.0"]
ibm = ["langchain-ibm>=1.0.0,<2.0.0"]
litellm = ["langchain-litellm>=0.6.1,<2.0.0"]
mistralai = ["langchain-mistralai>=1.0.0,<2.0.0"]
nvidia = ["langchain-nvidia-ai-endpoints>=1.0.0,<2.0.0"]
ollama = ["langchain-ollama>=1.0.0,<2.0.0"]
openai = ["langchain-openai>=1.1.8,<2.0.0"]
openrouter = ["langchain-openrouter>=0.1.0,<2.0.0"]
perplexity = ["langchain-perplexity>=1.0.0,<2.0.0"]
vertexai = ["langchain-google-vertexai>=3.0.0,<4.0.0"]
xai = ["langchain-xai>=1.0.0,<2.0.0"]
all-providers = [
    "bog-agents-cli[anthropic,baseten,bedrock,cohere,deepseek,fireworks,google-genai,groq,huggingface,ibm,litellm,mistralai,nvidia,ollama,openai,openrouter,perplexity,vertexai,xai]",
]
# Sandbox integrations (heavy dependencies, install only if needed)
sandbox = [
    "langsmith[sandbox]>=0.7.7",
    "daytona>=0.113.0,<1.0.0",
    "modal>=0.65.0,<2.0.0",
    "runloop-api-client>=0.69.0",
]
daytona-sandbox = ["daytona>=0.113.0,<1.0.0"]
modal-sandbox = ["modal>=0.65.0,<2.0.0"]
runloop-sandbox = ["runloop-api-client>=0.69.0"]
langsmith-sandbox = ["langsmith[sandbox]>=0.7.7"]
# Web search
web-search = ["tavily-python>=0.7.21,<1.0.0"]
# Agent Client Protocol
acp = ["bog-agents-acp>=0.0.4"]
# Everything
all = [
    "bog-agents-cli[all-providers,sandbox,web-search,acp]",
]

[project.scripts]
bog-agents = "bog_agents_cli:cli_main"
bog-agents-cli = "bog_agents_cli:cli_main"

[project.urls]
Homepage = "https://github.com/bogware/bog-agents"
Repository = "https://github.com/bogware/bog-agents"
Issues = "https://github.com/bogware/bog-agents/issues"
Changelog = "https://github.com/bogware/bog-agents/blob/main/libs/cli/CHANGELOG.md"

[dependency-groups]
test = [
    "build>=1.0.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
    "ty>=0.0.1,<1.0.0",
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=0.25.3,<2.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-socket>=0.7.0,<1.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-watcher>=0.3.4,<1.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "responses>=0.25.0,<1.0.0",
    "twine>=6.0.0,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bog_agents_cli"]
include = [
    "bog_agents_cli/defaults/**/*",
]

[tool.hatch.build.targets.wheel.shared-data]
"bog_agents_cli/default_agent_prompt.md" = "bog_agents_cli/default_agent_prompt.md"
"bog_agents_cli/*.tcss" = "bog_agents_cli/"

[tool.uv.sources]
bog_agents = { path = "../bog-agents", editable = true }
bog-agents-acp = { path = "../acp", editable = true }

[tool.ty.src]
exclude = [".pytest-tmp-runtime"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["../bog-agents"]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
division-by-zero = "error"
# Optional dependencies (daytona, modal, runloop, tavily, acp) are not installed
# in the base venv — they're extras. Suppress unresolved import errors.
unresolved-import = "ignore"
# CLI uses dynamic typing patterns extensively (Any from argparse, config, etc.)
invalid-argument-type = "ignore"
possibly-missing-attribute = "ignore"
# Many stale type: ignore comments from pre-ty migration; clean up incrementally
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "ignore"
# asyncio.to_thread ParamSpec inference limitation and test global state patterns
too-many-positional-arguments = "ignore"
not-subscriptable = "ignore"
unsupported-operator = "ignore"
# docker.py ExecuteResponse uses sandbox_id; langsmith client is dynamically typed
unknown-argument = "ignore"
no-matching-overload = "ignore"
# langsmith client returned as object; winsound is Windows-only optional module
unresolved-attribute = "ignore"

[tool.ruff]
exclude = [".pytest-tmp-runtime"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "ANN202",  # Missing return type annotation for private function — internal helpers
    "BLE001",  # Blind exception catch — CLI resilience
    "C90",     # McCabe complexity
    "COM812",  # Messes with the formatter
    "CPY",     # No copyright
    "D107",    # Missing docstring in __init__
    "DOC201",  # Docstring missing returns — not always applicable
    "E501",    # Line too long — handled by formatter where possible
    "EXE001",  # Shebang not executable — scripts may not need execute bit
    "FBT",     # Boolean positional arguments (too pedantic)
    "FIX002",  # Line contains TODO
    "FLY002",  # Consider f-string instead of join — join is clearer for multi-line strings
    "FURB113", # Repeated append — readability over micro-optimization
    "FURB118", # Reimplemented operator — lambda is clearer in context
    "ISC001",  # Messes with the formatter
    "ISC004",  # Implicit string concatenation in collection literal
    "PERF203", # Rarely useful
    "PERF401", # Manual list comprehension — readability
    "PLC0414", # Inconsistent with how type checkers expect to be notified of intentional re-exports
    "PLC0415", # Lazy imports are used extensively throughout the CLI for startup performance (deferred heavy imports)
    "PLR09",   # Too many something (args, branches, returns, statements, etc)
    "PLR1702", # Too many nested blocks
    "PLR2004", # Magic value comparison — fine for CLI logic
    "PLR6104", # Non-augmented assignment — readability
    "PLR6201", # Literal membership — readability
    "PLW1514", # Unspecified encoding — defaults are fine
    "S105",    # Hardcoded password string — false positives in CLI config
    "S310",    # Suspicious URL open — CLI opens user-provided URLs by design
    "S607",    # Start process with partial path — CLI invokes system tools by design
    "SIM103",  # Needless bool — readability
    "SIM105",  # Suppressible exception — try/except/pass is clearer sometimes
    "SLF001",  # Private member access
    "TC003",   # Typing-only standard library import — keep explicit
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
    "TRY300",  # Consider moving to else block — readability
    "UP036",   # Outdated version block — backwards compat
]
unfixable = ["B028"] # People should intentionally tune the stacklevel

flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["bog_agents_cli"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",   # Missing type annotation for function argument — not needed in tests
    "ANN002",   # Missing type annotation for *args — not needed in tests
    "ANN003",   # Missing type annotation for **kwargs — not needed in tests
    "ANN201",   # Missing return type annotation — not needed in tests
    "ARG002",   # Unused method argument — fixture params (e.g. tmp_path) may be unused in some tests
    "F841",     # Local variable assigned but unused — common in test setup
    "PT011",    # pytest.raises match= not required in tests — intent is clear from test name
    "SIM117",   # Nested with statements — readability in complex test setups
    "D1",       # Missing docstrings — not needed in tests
    "DOC",      # Docstring conventions — not needed in tests
    "F401",     # Imported but unused — test fixtures may appear unused
    "PLC0415",  # Lazy imports — test organization patterns
    "PLC1901",  # Comparison to empty string — fine in test assertions
    "PLC2701",  # Private name import — tests need access to internals
    "PLR2004",  # Magic value used in comparison — fine in test assertions
    "PLR6201",  # Literal membership test — fine in tests
    "PLR6301",  # Method could be a function — test class organization
    "PLW0108",  # Lambda may be unnecessary — fine in test mocks
    "RUF001",   # Ambiguous characters — fine in test strings
    "S",        # Security warnings — not applicable to tests
    "SLF",      # Private member access — tests need access to internals
]
"scripts/**" = [
    "BLE001",   # Blind exception catch — resilience in standalone scripts
    "INP",      # Missing `__init__.py` — scripts are standalone
    "S",        # Security warnings — not applicable to scripts
    "T201",     # `print` found — scripts use print for output
]
"examples/**" = [
    "ANN001",   # Missing type annotation for function argument — examples prioritize clarity
    "ANN201",   # Missing return type annotation — examples prioritize clarity
    "BLE001",   # Blind exception catch — resilience in example scripts
    "INP001",   # Missing `__init__.py` — examples are standalone
    "N806",     # Variable in function should be lowercase — example naming conventions
    "PLC0415",  # Lazy import — example organization patterns
    "PLR2004",  # Magic value used in comparison — fine in examples
    "T201",     # `print` found — examples use print for output
    "TRY300",   # Consider moving to `else` block — examples prioritize readability
]
"bog_agents_cli/built_in_skills/**/scripts/**" = [
    "ANN001",   # Missing type annotation for function argument — standalone scripts
    "ANN201",   # Missing return type annotation — standalone scripts
    "BLE001",   # Blind exception catch — resilience in standalone scripts
    "INP001",   # Missing `__init__.py` — scripts are standalone
    "N806",     # Variable in function should be lowercase — script naming conventions
    "PLR2004",  # Magic value used in comparison — fine in scripts
    "T201",     # `print` found — scripts use print for output
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
timeout = 30  # Default timeout for all tests (can be overridden per-test)

addopts = "--strict-markers --strict-config --durations=5 -p no:cacheprovider"
# pytest-benchmark warns once per xdist worker that benchmarks are disabled
# under parallel execution. Both plugins are needed: xdist for `make test`,
# benchmark for `make benchmark`. Suppress the noise here.
# Use a message-match filter so the import of pytest_benchmark isn't required
# when the plugin is not installed.
filterwarnings = [
    "ignore:.*pytest.benchmark.*:pytest.PytestConfigWarning",
    "ignore:.*virtual_mode.*:DeprecationWarning",
    "ignore:.*StoreBackend without explicit.*:DeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
