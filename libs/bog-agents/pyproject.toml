[project]
name = "bog-agents"
version = "0.9.12"

description = "Bog Agents — a still-water agent framework. Patient by default, opinionated where it matters, batteries included. Build agents on top of any major LLM provider (Anthropic, OpenAI, Bedrock, Google, Mistral, Groq, DeepSeek) or run local with Ollama. 80+ middlewares, real subagents, file-system + shell + sandbox backends, MCP tooling, a typed config surface. Built on LangGraph; pass through in harmony."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bogware", email = "support@bogware.com" }]
maintainers = [{ name = "bogware", email = "support@bogware.com" }]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "llm", "langgraph", "langchain", "bog-agents", "sub-agents", "agentic", "multi-provider", "ollama"]
classifiers = [
    # Downgraded from "5 - Production/Stable" per REVIEW.md P0-A: a cluster
    # of vertical-market middleware modules (financial_data, due_diligence,
    # earnings_analysis, etc.) ship as STUBS with banner warnings until they
    # are either implemented for real or extracted to a sister package.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anyio>=4.0.0,<5.0.0",
    # CVE-2026-40087 (langchain-core 1.2.x): fix landed in 1.2.28.
    # Floors track deepagents 0.7.0b2 so the two stay co-installable in one venv
    # (0.7 requires langchain-core>=1.5.0 / langchain>=1.3.14). See PARITY.md.
    "langchain-core>=1.5.0,<2.0.0",
    "langchain>=1.3.14,<2.0.0",
    # graph.py and ~15 middleware modules import langgraph directly (BaseCache,
    # channels, CompiledStateGraph, …); declare it explicitly instead of
    # relying on it arriving transitively via langchain. (REVIEW.md v2 P1-72.)
    "langgraph>=1.2.0,<2.0.0",
    "langchain-anthropic>=1.5.0,<2.0.0",
    "langchain-google-genai>=4.3.1,<5.0.0",
    # Must track deepagents' wcmatch floor to remain co-installable in one venv:
    # deepagents 0.6.12 floored it at 10.1, 0.7.0b2 raised it to 11.0. A mismatched
    # cap makes the two packages unresolvable together, defeating the drop-in
    # contract. See PARITY.md.
    "wcmatch>=11.0,<12.0",
    "pyyaml>=6.0.0,<7.0.0",

    # ─── transitive-CVE floors ──────────────────────────────────────
    # CVE-2026-34073 + CVE-2026-39892 — cryptography TLS fixes; GHSA-537c-gmf6-5ccf
    # — vulnerable OpenSSL bundled in cryptography wheels (needs 48.0.1)
    "cryptography>=48.0.1",
    # CVE-2026-30922 — pyasn1 DoS fix
    "pyasn1>=0.6.4",
    # CVE-2026-25645 — requests fix (langchain pulls via langsmith)
    "requests>=2.33.0",
    # CVE-2026-4539 — pygments ReDoS fix
    "pygments>=2.20.0",
    # CVE-2026-44431 + CVE-2026-44432 — urllib3 SSRF/cookie fixes
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
serve = [
    "starlette>=0.41.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.0.0",
]

# PDF reading for the read_file tool (pdf_reader middleware). pypdf is the
# default backend; pdfplumber / pymupdf are also supported if installed.
pdf = ["pypdf>=4.0.0"]

# Video-frame reading for the read_file tool (video_reader middleware). PyAV
# decodes frames; Pillow encodes the sampled JPEGs. Both are imported lazily so
# a default install stays lean.
video = ["av>=17.0.0,<19.0.0", "pillow>=10.0.0,<13.0.0"]

# ContextHubBackend — a persistent, versioned agent filesystem backed by a
# LangSmith Hub agent repo. langsmith arrives transitively via langchain, but
# the backend needs `Client.pull_agent` / `push_agent`, so pin the floor here.
# CVE-2026-45134 — langsmith fix landed in 0.8.0.
hub = ["langsmith>=0.10.9"]

# ─── provider extras ────────────────────────────────────────────────
# `resolve_model` dispatches through langchain's `init_chat_model`, which
# requires the provider's integration package to be installed. Anthropic
# and Google GenAI ship in the core dependencies above; the rest are opt-in
# so a default install stays lean. Install e.g. `bog-agents[bedrock]` to use
# AWS Bedrock, or `bog-agents[all-providers]` for the full set.
bedrock = ["langchain-aws>=1.0.0,<2.0.0"]
openai = ["langchain-openai>=1.1.14,<2.0.0"]
all-providers = [
    "langchain-aws>=1.0.0,<2.0.0",
    "langchain-openai>=1.1.14,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/bogware/bog-agents"
Repository = "https://github.com/bogware/bog-agents"
Issues = "https://github.com/bogware/bog-agents/issues"


[dependency-groups]
test = [
  # CVE-2025-71176 — fix landed in 9.0.3
  "pytest>=9.0.3",
  "pytest-cov",
  "pytest-xdist",
  "pytest-timeout>=2.3.1,<3.0.0",
  "pytest-socket",
  "pytest-watcher>=0.3.4,<1.0.0",
  "ruff>=0.12.2,<0.17.0",
  "ty>=0.0.1,<1.0.0",
  "pytest-asyncio>=1.3.0",
  # GHSA-r7w7-9xr2-qq2r — fix landed in 1.1.14
  "langchain-openai>=1.1.14",
  "twine",
  "build",
  # serve endpoint tests (test_serve_hardening) exercise create_app() via the
  # Starlette TestClient — pull the serve extra's deps so the 501/CORS coverage
  # runs deterministically in CI instead of skipping when it's absent.
  "starlette>=0.41.0",
  "sse-starlette>=2.0.0",
]

serve = [
  "starlette>=0.41.0",
  "uvicorn>=0.34.0",
  "sse-starlette>=2.0.0",
]

evals = [
  # CVE-2026-45134 — langsmith fix landed in 0.8.0
  "langsmith>=0.10.9",
  "langchain-xai",
  "langchain-mistralai",
  "langchain-deepseek",
  "langchain-groq",
  "langchain-ollama",
  "langchain-fireworks",
  "langchain-baseten",
  "datasets>=3.0.0",
  # CVE-2026-33230 + CVE-2026-33231 + GHSA-rf74-v2fm-23pw — nltk fix landed in 3.9.4
  "nltk>=3.9.4",
  "tiktoken>=0.8.0",
  # CVE-2026-22815, CVE-2026-34514–34525 series — aiohttp HTTP-smuggling fixes
  # landed in 3.13.4 (pulled in via langsmith/sandbox + tavily evals chain)
  "aiohttp>=3.13.4",
  # CVE-2026-40192 / 42308 / 42309 / 42310 / 42311 — pillow image-decoder fixes
  # in 12.2.0 (pulled in via tavily + datasets transitives)
  "pillow>=12.2.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["py.typed", "*.md"]

[tool.ruff]
line-length = 150
# Exclude any files that shouldn't be linted
exclude = [".pytest-tmp-runtime"]

[tool.ruff.format]
docstring-code-format = true  # Formats code blocks in docstrings

[tool.ruff.lint]
select = [
    "ALL"  # Enable all rules by default
]
ignore = [
    "C90",     # McCabe complexity — graph assembly is inherently complex
    "COM812",  # Trailing comma missing — conflicts with the ruff formatter
    "CPY",     # No copyright headers
    "FBT",     # Boolean positional arguments — too pedantic for middleware config flags
    "FIX002",  # Line contains TODO
    "ISC001",  # Implicit string concatenation on one line — conflicts with the ruff formatter
    "PERF203", # `try`-`except` within a loop — incurs overhead only when exceptions are common
    "PLC0414", # Import alias does not rename original package — conflicts with type-checker re-export conventions
    "PLC0415", # Lazy imports are used extensively for fast startup (deferred heavy imports)
    "PLR09",   # Too many something (args, branches, returns, statements, etc)
    "PLR1702", # Too many nested blocks
    "SLF001",  # Access to a private member of an external class
    "TD002",   # Missing author in TODO
    "TD003",   # Missing issue link in TODO
]
unfixable = ["B028"]  # Rules that shouldn't be auto-fixed

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
known-first-party = ["bog-agents"]

[tool.ruff.lint.pydocstyle]
convention = "google"  # Google-style docstrings
ignore-var-parameters = true

[tool.ruff.lint.per-file-ignores]
# Evidence bundles run git + user-configured verification commands by design
# (argv form, no shell) — the same system-call posture as backends/middleware.
"bog_agents/evidence.py" = ["S603", "S607"]  # argv-form git/check subprocess by design
# Evals: task-agnostic primitives (arbitrary Any I/O) + intentional per-case
# resilience (a task/scorer crash is a failed case, not a runner crash).
"bog_agents/evals/**" = [
    "ANN401",  # Any — eval task input/output is deliberately type-agnostic
    "BLE001",  # Blind except — a crashing task/scorer must score as failed, not abort the run
    "D102",    # Scorer .score is documented on the Scorer protocol
    "D105",    # Dunder methods (__iter__/__len__)
    "EM102",   # f-string in exception — readable assert_pass_rate message
    "TRY003",  # Long exception message — the CI assert message is intentional
]
# Guardrails: same shape as evals — protocol .check documented on the Protocol,
# Any-typed judge model, intentional fail-open except for judge resilience.
"bog_agents/guardrails/**" = [
    "ANN401",  # Any — LLMGuardrail accepts any chat model
    "BLE001",  # Blind except — a judge-model outage must fail open, not crash
    "D102",    # .check documented on the Guardrail protocol
    "D105",    # Dunder methods
    "D107",    # __init__ docstring
    "EM102",
    "TRY003",
]
# Middleware: many interface methods have unused args, complex logic, blind excepts
"bog_agents/middleware/**" = [
    "ANN401",  # Dynamically typed expressions (Any) — middleware often wraps unknown types
    "ARG001",  # Unused function argument — interface compliance
    "ARG002",  # Unused method argument — interface compliance
    "ARG005",  # Unused lambda argument — callback interfaces
    "BLE001",  # Blind exception catch — resilience in middleware
    "D107",    # Missing docstring in __init__
    "D205",    # Missing blank line after summary
    "D301",    # Escape sequence in docstring
    "D417",    # Missing argument descriptions — middleware has many config params
    "DTZ",     # Datetime timezone — middleware uses naive datetimes intentionally
    "E501",    # Line too long — some middleware has long structured strings
    "E741",    # Ambiguous variable name — short vars in algorithms
    "EM102",   # f-string in exception — readability over style
    "F811",    # Redefined while unused — overloaded test patterns
    "F841",    # Unused variable — intermediate assignments for clarity
    "N802",    # Invalid function name — callback naming conventions
    "N817",    # CamelCase imported as acronym
    "PERF401", # Manual list comprehension — readability over micro-optimization
    "PIE810",  # Multiple starts/ends-with — readability
    "PLE0604", # Invalid __all__ object
    "PLR2004", # Magic value used in comparison
    "PLW1510", # subprocess.run without check — handled by middleware
    "PLW2901", # Redefined loop variable
    "PTH",     # Use pathlib — os.path is fine for system operations
    "RET504",  # Unnecessary assignment before return — clarity
    "RUF059",  # Unused unpacked variable
    "S",       # Security warnings — middleware handles system calls by design
    "SIM",     # Simplification suggestions — readability tradeoffs
    "TC",      # Typing-only imports — keep runtime imports explicit for middleware
    "TRY",     # Exception handling style — middleware needs flexible error handling
    "UP042",   # Replace str enum — backwards compat with py3.10
    "ASYNC109", # Async function with timeout arg — many middleware accept their own
    "D102",    # Missing docstring in public method — middleware override hooks have docstrings on the base class
    "PERF203", # try/except in loop — retry middleware iterates with try inside
    "PLR0911", # Too many returns — middleware has multi-arm dispatch
    "PLR0913", # Too many arguments — middleware constructors are config-heavy
    "PLR2004", # Magic value used in comparison
    "RUF005",  # Iterable unpacking — common in middleware composition
    "S311",    # `random` not for crypto — fine for jitter
]
# Serve module: network code with security, subprocess, broad exception handling
"bog_agents/serve.py" = [
    "ANN401",  # Any type — HTTP handlers accept various types
    "ARG001",  # Unused function argument — ASGI interface compliance
    "BLE001",  # Blind exception catch — server resilience
    "D417",    # Missing argument descriptions
    "E741",    # Ambiguous variable name
    "S",       # Security warnings — server code handles secrets by design
    "TC",      # Typing-only imports
    "TRY",     # Exception handling style
]
# Graph assembly: complex by nature, many conditional imports and params
"bog_agents/graph.py" = [
    "ANN401",  # Any type — graph accepts varied tool types
    "ARG001",  # Unused function argument
    "D417",    # Missing argument descriptions — 80+ params documented elsewhere
    "E741",    # Ambiguous variable name
    "TC",      # Typing-only imports
]
# Backends: system-level code with os.path, subprocess, etc.
"bog_agents/backends/**" = [
    "E501",    # Line too long
    "PTH",     # Use pathlib — os.path is fine for system operations
    "S",       # Security warnings — backends handle system calls by design
    "SIM",     # Simplification suggestions
]
# Sandbox: system-level code
"bog_agents/sandbox/**" = [
    "E501",    # Line too long
    "PTH",     # Use pathlib — os.path is fine for system operations
    "S",       # Security warnings
    "SIM",     # Simplification suggestions
]
# Tests: relax annotations, docstrings, magic values, security, and assertion style
"tests/**" = [
    "ANN001",  # Missing type annotation for function argument
    "ANN201",  # Missing return type annotation for public function
    "ANN202",  # Missing return type annotation for private function
    "ARG",     # Unused arguments — common for pytest fixtures and lambda stubs
    "D",       # Docstrings — not needed in tests
    "DTZ",     # Datetime timezone — tests use naive datetimes
    "F811",    # Redefined while unused — test imports shadow intentionally
    "N802",    # Invalid function name — test helper naming conventions
    "PERF401", # Manual list comprehension — readability in tests
    "PLR2004", # Magic value used in comparison — fine in test assertions
    "PT018",   # Assertion should be broken down into multiple parts
    "PTH",     # Use pathlib — os.path is fine in tests
    "S",       # Security warnings — not applicable to tests
    "N801",    # Class naming convention — fake exception names use _Fake* prefix
    "N802",    # Function naming
    "N818",    # Exception subclasses with non-Error suffix — fakes mimic provider names
    "RUF029",  # Async function w/o await — required to satisfy async callback signatures
    "TRY002",  # Custom exception subclassing — fine for fakes in tests
    "TRY003",  # Long exception messages
    "TC001",   # Type-checking-block import moves are noise for test files
    "TC002",   # (pytest, pathlib, etc. imported at top of tests is fine)
    "TC003",
    "EM101",   # Exception literal in raise
    "EM102",   # Exception f-string in raise
    "B904",    # raise from — not always meaningful in tests
    "ARG005",  # Unused lambda argument
    "ANN401",  # Any type annotations
    "PT011",   # pytest.raises without match
    "PLR6301", # Method could be a function
    "SLF001",  # Private member access — tests need this
]
# Test-support utilities shipped in the package (e.g. SandboxConformanceSuite):
# pytest-style mixins that legitimately use `assert` and have no per-method
# docstrings, same as the test files that consume them.
"bog_agents/testing/**" = [
    "S101",    # Use of assert — the whole point of a conformance suite
    "D102",    # Missing docstring in public method — test methods are self-describing
    "PLR6301", # Method could be a function — pytest test methods take `self`
    "PT",      # pytest-style conventions
    "EM101",   # Exception string literal — fine for the fixture NotImplementedError
]
# Scripts: allow prints, broad exceptions, and standalone modules
"scripts/**" = [
    "BLE001",  # Blind exception catch — resilience in standalone scripts
    "INP001",  # Missing `__init__.py` — scripts are standalone
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "-p no:cacheprovider --strict-markers"
filterwarnings = [
    "ignore:.*virtual_mode.*:DeprecationWarning",
    "ignore:.*StoreBackend without explicit.*:DeprecationWarning",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Most rules are enabled by default. Enable rules that are disabled by default:
division-by-zero = "error"
# Middleware subclasses intentionally narrow/widen signatures for ergonomic APIs.
# These are false positives from the AgentMiddleware base class generics.
invalid-method-override = "ignore"
invalid-type-arguments = "ignore"
# Middleware uses dynamic typing patterns (Any, union narrowing) extensively.
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
no-matching-overload = "ignore"
not-iterable = "ignore"
# Optional extras (serve: starlette, uvicorn, sse-starlette; middleware: aiohttp)
# are not installed in the base venv — suppress unresolved import errors.
unresolved-import = "ignore"
# Complex middleware generics and async wrapping patterns
invalid-type-form = "ignore"
invalid-return-type = "ignore"
invalid-await = "ignore"
unresolved-attribute = "ignore"
missing-argument = "ignore"
# Suppress stale ty: ignore comments that become redundant after rule changes
unused-ignore-comment = "ignore"
