[project]
name = "bog-agents-daemon"
version = "0.9.12"
description = "Bog Agents Daemon — the patient watcher. Runs your bog-agents on cron schedules, file-change triggers, webhooks, and git push events; survives reboots, persists state, and reports back. Use it when you want an agent that wakes itself rather than waiting for you. Pass through in harmony."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bogware", email = "support@bogware.com" }]
maintainers = [{ name = "bogware", email = "support@bogware.com" }]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "daemon", "scheduler", "cron", "llm", "langgraph", "langchain", "bog-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "bog-agents>=0.7.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "aiofiles>=23.0.0,<25.0.0",
    # Cron parsing + missed-slot catch-up (DMN-5). Replaces the hand-rolled
    # 5-field parser: correct ranges/steps/lists/macros and, crucially,
    # get_next()-based catch-up so a scheduled slot missed during downtime
    # still fires once on restart.
    "croniter>=2.0.0,<7.0.0",
    # Event-driven file-change triggers (inotify/FSEvents/ReadDirectoryChangesW)
    # replacing 30s os.walk polling; the scheduler falls back to polling if the
    # observer can't start on a given platform/filesystem.
    "watchdog>=4.0.0,<7.0.0",

    # ─── transitive-CVE floors (mirror libs/bog-agents and libs/cli so
    # bog-agents-daemon resolves a patched set on a clean install) ───
    # CVE-2026-44431 + CVE-2026-44432 — urllib3 SSRF/cookie fixes
    "urllib3>=2.7.0",
    # CVE-2026-40347 — python-multipart DoS fix via starlette/uvicorn chain
    "python-multipart>=0.0.31",
    # CVE-2026-45134 — langsmith stale-token bug (langchain pulls it transitively)
    "langsmith>=0.8.18",
    # GHSA-537c-gmf6-5ccf — vulnerable OpenSSL bundled in cryptography wheels
    # (needs 48.0.1; forces langchain-litellm>=0.7.0, which had capped it low).
    "cryptography>=48.0.1",
    # CVE-2026-25645 — requests CRLF fix
    "requests>=2.33.0",
]

[project.optional-dependencies]
# Model providers — mirror bog-agents-cli so a daemon install can run agents
# end-to-end without a separate `pip install langchain-<provider>` dance.
anthropic = ["langchain-anthropic>=1.0.0,<2.0.0"]
baseten = ["langchain-baseten>=0.1.9,<1.0.0"]
bedrock = ["langchain-aws>=1.0.0,<2.0.0"]
cohere = ["langchain-cohere>=0.5.0,<1.0.0"]
deepseek = ["langchain-deepseek>=1.0.0,<2.0.0"]
fireworks = ["langchain-fireworks>=1.0.0,<2.0.0"]
google-genai = ["langchain-google-genai>=4.0.0,<5.0.0"]
groq = ["langchain-groq>=1.0.0,<2.0.0"]
huggingface = ["langchain-huggingface>=1.0.0,<2.0.0"]
ibm = ["langchain-ibm>=1.0.0,<2.0.0"]
litellm = ["langchain-litellm>=0.6.1,<2.0.0"]
mistralai = ["langchain-mistralai>=1.0.0,<2.0.0"]
nvidia = ["langchain-nvidia-ai-endpoints>=1.0.0,<2.0.0"]
ollama = ["langchain-ollama>=1.0.0,<2.0.0"]
openai = ["langchain-openai>=1.1.8,<2.0.0"]
openrouter = ["langchain-openrouter>=0.1.0,<2.0.0"]
perplexity = ["langchain-perplexity>=1.0.0,<2.0.0"]
vertexai = ["langchain-google-vertexai>=3.0.0,<4.0.0"]
xai = ["langchain-xai>=1.0.0,<2.0.0"]
all-providers = [
    "bog-agents-daemon[anthropic,baseten,bedrock,cohere,deepseek,fireworks,google-genai,groq,huggingface,ibm,litellm,mistralai,nvidia,ollama,openai,openrouter,perplexity,vertexai,xai]",
]
# Sandbox integrations (heavy; install only if you submit jobs that target one).
# V3-14: only daytona + langsmith sandboxes are actually wired today; the modal
# and runloop extras were never landed (no backend code references them), so they
# are not advertised — re-add an extra only once a corresponding backend exists.
sandbox = [
    "langsmith[sandbox]>=0.7.7",
    "daytona>=0.113.0,<1.0.0",
]
daytona-sandbox = ["daytona>=0.113.0,<1.0.0"]
langsmith-sandbox = ["langsmith[sandbox]>=0.7.7"]
# Web search
web-search = ["tavily-python>=0.7.21,<1.0.0"]
# Agent Client Protocol.
#
# NOTE (DEL-1): `bog-agents-acp` is not on PyPI yet, so it is intentionally NOT
# part of `all` — including it makes `pip install bog-agents-daemon[all]` fail
# resolution for every user. Install ACP from source until it is published.
# Everything (publishable extras only; excludes harbor: harbor requires Python
# 3.12+ but the daemon supports 3.11+ — users on 3.12+ can
# `pip install bog-agents-harbor` directly)
all = [
    "bog-agents-daemon[all-providers,sandbox,web-search]",
]

[project.scripts]
bog-agents-daemon = "bog_agents_daemon.main:main"

[project.urls]
Homepage = "https://github.com/bogware/bog-agents"
Repository = "https://github.com/bogware/bog-agents"
Issues = "https://github.com/bogware/bog-agents/issues"
Changelog = "https://github.com/bogware/bog-agents/blob/main/libs/daemon/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bog_agents_daemon"]

[tool.uv.sources]
bog_agents = { path = "../bog-agents", editable = true }
bog-agents-acp = { path = "../acp", editable = true }

[dependency-groups]
test = [
    "pytest>=9.0.3",  # CVE-2025-71176 — fix landed in 9.0.3
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27.0",
    "ruff>=0.12.0,<0.16.0",
    "ty>=0.0.1,<1.0.0",  # V3-10: daemon source is now type-checked in CI
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"
# PLW1514 (unspecified-encoding) is a ruff *preview* rule. Enable preview so
# the rule is active, but pair it with `explicit-preview-rules` so ONLY the
# preview rules we list by code (PLW1514) turn on — the rest of the preview
# ruleset stays off. This keeps CLAUDE.md's mandated encoding check enforced
# on the always-on daemon without dragging in unrelated preview lint.
preview = true

[tool.ruff.lint]
explicit-preview-rules = true
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM", "PTH", "RUF", "PLW1514"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "ARG"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["../bog-agents"]

[tool.ty.rules]
# https://docs.astral.sh/ty/rules/
# Model-provider extras (langchain-*) and the optional daytona/langsmith sandbox
# deps are not installed in the base venv — suppress unresolved-import noise.
unresolved-import = "ignore"
# The daemon leans on dynamic typing at the create_agent / astream boundary
# (Any-typed chunks, **kwargs config) — mirror the CLI/SDK ty posture.
invalid-argument-type = "ignore"
possibly-missing-attribute = "ignore"
unused-ignore-comment = "ignore"
