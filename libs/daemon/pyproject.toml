[project]
name = "bog-agents-daemon"
version = "0.7.1"
description = "Ambient agent daemon for bog-agents — run agents on schedules, file-change triggers, webhooks, and git pushes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bogware", email = "support@bogware.com" }]
maintainers = [{ name = "bogware", email = "support@bogware.com" }]
requires-python = ">=3.11,<4.0"
keywords = ["agents", "ai", "daemon", "scheduler", "cron", "llm", "langgraph", "langchain", "bog-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "bog-agents>=0.7.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "aiofiles>=23.0.0,<25.0.0",
]

[project.scripts]
bog-agents-daemon = "bog_agents_daemon.main:main"

[project.urls]
Homepage = "https://github.com/bogware/bog-agents"
Repository = "https://github.com/bogware/bog-agents"
Issues = "https://github.com/bogware/bog-agents/issues"
Changelog = "https://github.com/bogware/bog-agents/blob/main/libs/daemon/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bog_agents_daemon"]

[tool.uv.sources]
bog_agents = { path = "../bog-agents", editable = true }

[dependency-groups]
test = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27.0",
    "ruff>=0.12.0,<0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "ARG"]
